<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Sepehr Car Gallery</title><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><a class="logo" href="CLS.html"><span>Mercedes</span>-Benz</a><nav><a href="CLS.html">Home</a><a href="admin.html">Admin</a></nav></header><main class="section"><div class="section-heading"><p class="eyebrow">GET IN TOUCH</p><h1>Contact Sepehr Car Gallery</h1></div><div class="two-col"><form id="contactForm" class="panel form"><h2>Send a message</h2><label>Your name<input name="name" required></label><label>Email or phone<input name="contact" required></label><label>Message<textarea name="message" required></textarea></label><button class="gold-button">Save Message</button><p id="contactMessage" class="message"></p></form><div class="panel"><h2>Showroom information</h2><p>Add your showroom address and phone number here.</p><p class="notice">Demo form only: messages are saved in this browser and are not emailed.</p></div></div>
